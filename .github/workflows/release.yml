# Publishes a GitHub release when a version tag is pushed:
#
#     git tag v1.0.0 && git push origin v1.0.0
#
# The tag must match VERSION in src/.zos/lib/system.lua.
# Computers update themselves from this release, so anything published here runs on them.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # to create the release
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the zOS version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^ *VERSION = "\(.*\)",$/\1/p' src/.zos/lib/system.lua)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG doesn't match system.VERSION $version"
            exit 1
          fi

      - name: Install Lua tools
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 liblua5.1-0-dev lua5.2 luarocks luajit
          luarocks --tree lua_modules --lua-version=5.1 install luasrcdiet 1.0.0-2

      - name: Run the tests
        run: |
          for test in tests/test_*.lua; do
            case "$test" in
              tests/test_install.lua | tests/test_package.lua | tests/test_recovery.lua) lua5.2 "$test" ;;
              *) luajit "$test" ;;
            esac
          done

      - name: Build
        run: ./build.sh

      - name: Test the minified installer
        run: ZOS_INSTALLER=dist/install.lua lua5.2 tests/test_install.lua

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cat > notes.md <<NOTES
          ## Install

          In game, on a computer with internet access:

          \`\`\`
          wget run https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/install.lua
          \`\`\`

          To make a setup disk, copy \`zos.zi\` and \`install.lua\` to a floppy.

          To install or update apps, use App Manager > Get apps from GitHub. Each app is also
          here as a \`.za\` file, for App Manager's Install from disk.
          NOTES
          gh release create "$TAG" dist/zos.zi dist/install.lua dist/apps/*.za \
            dist/zos-update.manifest dist/zos-apps.manifest \
            --verify-tag --title "zOS ${TAG#v}" --notes-file notes.md --generate-notes
